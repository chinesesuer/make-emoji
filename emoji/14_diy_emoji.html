   统一渲染路径：img 与 part 只是 src 不同，定位逻辑完全一致。
   ================================================================== */
function specs(st){
  const out = [];
  const faceObj = (st.face != null) ? FACES[st.face] : null;
  if (faceObj) out.push({src:U(faceObj.c), x:O, y:O, w:S, h:S});

  /* 自带五官的脸型（人物/动物）不再叠加眼睛/嘴巴/异瞳，否则会出现双重五官 */
  const baseHasFeatures = !!(faceObj && FACE_NO_FEATURES.has(faceObj.c));

  if (!baseHasFeatures){
    const eye = (st.eyes != null) ? EYES[st.eyes] : null;
    if (eye){
      out.push({src:P(eye.c + '__l'), x:EXL - eye.l[2] * S / 2, y:EY - eye.l[3] * S / 2, w:eye.l[2] * S, h:eye.l[3] * S});
      out.push({src:P(eye.c + '__r'), x:EXR - eye.r[2] * S / 2, y:EY - eye.r[3] * S / 2, w:eye.r[2] * S, h:eye.r[3] * S});
    }
    if (eye && eye.p && st.pupil != null && PUPILS[st.pupil]){
      const p = PUPILS[st.pupil].c;
      if (eye.p !== 2) out.push({src:U(p), x:EXL - PUPIL / 2, y:EY - PUPIL / 2, w:PUPIL, h:PUPIL});
      out.push({src:U(p), x:EXR - PUPIL / 2, y:EY - PUPIL / 2, w:PUPIL, h:PUPIL});
    }
    if (st.mouth != null && MOUTHS[st.mouth]){
      const m = MOUTHS[st.mouth];
      out.push({src:P(m.c + '__m'), x:MX - m.m[2] * S / 2, y:MY - m.m[3] * S / 2, w:m.m[2] * S, h:m.m[3] * S});
    }
  }
  (st.deco || []).forEach(function (i){
    const d = DECOS[i]; if (!d) return;
    const sl = SLOT[d.s];
    out.push({src:U(d.c), x:sl.x - sl.s / 2, y:sl.y - sl.s / 2, w:sl.s, h:sl.s});
  });
  return out;
}

/* ---------------- 渲染：整块 200×200 图层栈 ---------------- */
function stackHTML(st){
  return specs(st).map(function (l){
    return `<i class="ly" style="left:${l.x}px;top:${l.y}px;width:${l.w}px;height:${l.h}px;` +
           `background-image:url(${l.src});background-size:${l.w}px ${l.h}px"></i>`;
  }).join('');
}
/* 把 200 画布中的某块区域 [vx,vy,vw,vh] 铺满 size×size 显示 */
function framed(st, vx, vy, vw, size){
  const k = size / vw;
  return `<div style="position:relative;width:${size}px;height:${size}px;overflow:hidden">
      <div style="position:absolute;left:0;top:0;width:200px;height:200px;transform-origin:0 0;transform:scale(${k}) translate(${-vx}px,${-vy}px)">${stackHTML(st)}</div>
    </div>`;
}

/* ---------------- 素材缩略图（复用同一套图层） ---------------- */
const THUMB = 42;
function faceThumb(i){ return framed({face:i}, 0, 0, 200, THUMB); }
function eyeThumb(i){ return framed({eyes:i, pupil: state.pupil}, 28, 22, 144, THUMB); }
function pupilThumb(i){
  const e = (state.eyes != null && EYES[state.eyes].p !== 0) ? state.eyes : 0;
  return framed({eyes:e, pupil:i}, 40, 40, 120, THUMB);
}
function mouthThumb(i){ return framed({mouth:i}, 38, 70, 124, THUMB); }
function decoThumb(i){ return framed({deco:[i]}, 0, 0, 200, THUMB); }
function buildThumb(i){
  return cur === 0 ? faceThumb(i) : cur === 1 ? eyeThumb(i) : cur === 2 ? pupilThumb(i) : cur === 3 ? mouthThumb(i) : decoThumb(i);
}
function catLen(){ return [FACES.length, EYES.length, PUPILS.length, MOUTHS.length, DECOS.length][cur]; }
function isOn(i){
  return [state.face, state.eyes, state.pupil, state.mouth][cur] === i ||
         (cur === 4 && state.deco.indexOf(i) > -1);
}

/* ---------------- 渲染 ---------------- */
function renderPreview(){
  const box = document.getElementById('preview');
  const empty = state.face == null && state.eyes == null && state.mouth == null && state.deco.length === 0;
  if (empty){
    box.innerHTML = `<div class="w-[248px] h-[248px] rounded-full border-[3px] border-dashed border-slate-200 flex flex-col items-center justify-center text-slate-300">
        <i class="fa-regular fa-face-smile text-[64px]"></i>
        <p class="text-[13px] mt-2">从下方素材开始 DIY</p>
      </div>`;
    return;
  }
  box.innerHTML = framed(state, 0, 0, 200, 260);
}
function renderGrid(){
  const grid = document.getElementById('grid');
  let html = '';
  for (let i = 0, n = catLen(); i < n; i++){
    const on = isOn(i);
    html += `<button data-i="${i}" class="grid-item aspect-square rounded-xl flex items-center justify-center transition
        ${on ? 'bg-[#5B5FE9]/10 ring-2 ring-[#5B5FE9]' : 'active:bg-slate-100'}">${buildThumb(i)}</button>`;
  }
  grid.innerHTML = html;
}
function renderCats(){
  const faceObj = (state.face != null) ? FACES[state.face] : null;
  const feat = !!(faceObj && FACE_NO_FEATURES.has(faceObj.c));
  if (feat && cur >= 1 && cur <= 3) cur = 0;   // 自带五官的脸型：眼睛/异瞳/嘴巴无意义
  document.querySelectorAll('.cat').forEach(function (b, i){
    const on = i === cur;
    const disabled = feat && i >= 1 && i <= 3;
    b.disabled = disabled;
    b.className = 'cat flex-1 py-2.5 rounded-xl text-[15px] transition ' +
      (disabled ? 'opacity-40 cursor-not-allowed bg-white border border-slate-200 text-slate-400'
       : on ? 'bg-[#5B5FE9] text-white font-semibold shadow-sm shadow-[#5B5FE9]/30'
            : 'bg-white border border-slate-200 text-slate-700 active:bg-slate-50');
  });
  document.getElementById('hint').textContent = feat
    ? '当前脸型已自带五官，眼睛 / 异瞳 / 嘴巴已自动隐藏'
    : CATS[cur].hint;
}
function renderUndo(){
  const b = document.getElementById('btnUndo');
  b.disabled = history.length === 0;
  b.classList.toggle('opacity-40', history.length === 0);
}
function renderAll(){ renderPreview(); renderCats(); renderGrid(); renderUndo(); }

/* ---------------- 交互 ---------------- */
function snap(){ history.push(JSON.stringify(state)); if (history.length > 40) history.shift(); }

document.getElementById('cats').addEventListener('click', function (e){
  const b = e.target.closest('.cat');
  if (!b || b.disabled) return;
  cur = +b.dataset.c;
  renderGrid(); renderCats();
});

document.getElementById('grid').addEventListener('click', function (e){
  const b = e.target.closest('.grid-item');
  if (!b) return;
  const i = +b.dataset.i;
  snap();
  if (cur === 0) state.face = state.face === i ? null : i;
  else if (cur === 1) state.eyes = state.eyes === i ? null : i;
  else if (cur === 2){
    state.pupil = state.pupil === i ? 0 : i;
    // 当前眼型若看不见瞳孔（闭眼/爱心眼等），自动切到能看见瞳孔的眼型
    if (state.eyes != null && EYES[state.eyes].p === 0) state.eyes = 0;
  }
  else if (cur === 3) state.mouth = state.mouth === i ? null : i;
  else {
    const k = state.deco.indexOf(i);
    if (k > -1) state.deco.splice(k, 1); else state.deco.push(i);
  }
  renderAll();
});

document.getElementById('btnReset').onclick = function (){
  snap();
  state.face = null; state.eyes = null; state.pupil = 0; state.mouth = null; state.deco = [];
  renderAll(); tip('已重置，重新开始 DIY');
};

document.getElementById('btnUndo').onclick = function (){
  if (!history.length) return;
  const prev = JSON.parse(history.pop());
  state.face = prev.face; state.eyes = prev.eyes; state.pupil = prev.pupil;
  state.mouth = prev.mouth; state.deco = prev.deco;
  renderAll(); tip('已撤回上一步');
};

/* ---------------- 保存：把同一份图层画到 canvas 导出 PNG ---------------- */
const imgCache = {};
function loadImg(src){
  return new Promise(function (res){
    if (imgCache[src]) return res(imgCache[src]);
    const im = new Image();
    im.onload = function (){ imgCache[src] = im; res(im); };
    im.onerror = function (){ res(null); };
    im.src = src;
  });
}
document.getElementById('btnSave').onclick = function (){
  const layers = specs(state);
  const srcs = layers.map(l => l.src).filter((v, i, a) => a.indexOf(v) === i);
  Promise.all(srcs.map(loadImg)).then(function (imgs){
    const map = {}; srcs.forEach(function (s, i){ map[s] = imgs[i]; });
    const K = 512 / 200;
    const cv = document.createElement('canvas');
    cv.width = cv.height = 512;
    const g = cv.getContext('2d');
    layers.forEach(function (l){
      const im = map[l.src]; if (!im) return;
      // 每个图层都是「整张图铺到 (x,y,w,h)」，part 已是透明底局部图，face/pupil/deco 是整张 emoji
      g.drawImage(im, l.x * K, l.y * K, l.w * K, l.h * K);
    });
    try {
      const a = document.createElement('a');
      a.download = 'diy-emoji.png';
      a.href = cv.toDataURL('image/png');
      a.click();
      tip('已保存到相册（diy-emoji.png）');
    } catch (err){ tip('已保存到相册'); }
  });
};

document.getElementById('btnShare').onclick = function (){ tip('已调起微信分享面板'); };

/* ---------------- 提示 ---------------- */
const toast = document.getElementById('toast');
let toastTimer = null;
function tip(msg){
  toast.textContent = msg;
  toast.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function (){ toast.classList.add('hidden'); }, 1500);
}

/* ---------------- 深链：便于原型总览展示不同分类状态 ----------------
   #cat=deco                          → 打开时定位到「装饰」分类
   #cat=deco&s=0-9-0-4-8,17           → 预设（脸型-眼睛-异瞳-嘴巴-装饰，空值=未选）
   ----------------------------------------------------------------- */
const HMAP = { face:0, eyes:1, pupil:2, mouth:3, deco:4 };
const mh = location.hash.match(/cat=(\w+)/);
if (mh && HMAP[mh[1]] !== undefined) cur = HMAP[mh[1]];
const ms = location.hash.match(/s=([0-9,\-]+)/);
if (ms){
  const g = ms[1].split('-');
  const num = v => (v === undefined || v === '') ? null : +v;
  state.face  = num(g[0]);
  state.eyes  = num(g[1]);
  state.pupil = (g[2] === undefined || g[2] === '') ? 0 : +g[2];
  state.mouth = num(g[3]);
  state.deco  = g[4] ? g[4].split(',').map(Number).filter(n => !isNaN(n)) : [];
}

/* ---------------- 启动：与参考图一致的默认表情（大眼萌 + 微笑） ---------------- */
renderAll();
</script>

</body>
