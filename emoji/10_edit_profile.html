<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>编辑资料</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="bg-slate-200 min-h-screen flex items-center justify-center py-6 font-sans">

<div class="relative bg-white rounded-[56px] border-[14px] border-black shadow-2xl overflow-hidden flex flex-col" style="width:430px;height:932px">

  <!-- 顶部蓝色区 -->
  <div class="bg-[#5B5FE9] shrink-0 pb-5">
    <div class="flex items-center justify-between px-9 pt-4 pb-1 text-white">
      <span class="text-[15px] font-semibold tracking-wide">9:41</span>
      <div class="flex items-center gap-1.5 text-[13px]">
        <i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full text-[16px]"></i>
      </div>
    </div>
    <div class="flex items-center justify-between px-5 pt-2">
      <button class="w-9 h-9 rounded-full bg-white/20 text-white flex items-center justify-center"><i class="fa-solid fa-chevron-left text-[14px]"></i></button>
      <h1 class="text-white text-[19px] font-bold">编辑资料</h1>
      <button class="text-white text-[15px] font-bold">保存</button>
    </div>
  </div>

  <!-- 内容 -->
  <div class="flex-1 bg-slate-100 overflow-y-auto no-scrollbar pb-36">
    <!-- 头像 -->
    <div class="flex flex-col items-center pt-8">
      <div class="relative">
        <div class="w-24 h-24 rounded-3xl bg-sky-100 flex items-center justify-center text-[52px]">👦</div>
        <button class="absolute -bottom-2 -right-2 w-9 h-9 rounded-full bg-[#5B5FE9] text-white flex items-center justify-center text-[13px] shadow-lg shadow-[#5B5FE9]/30"><i class="fa-solid fa-camera"></i></button>
      </div>
      <p class="text-[13px] text-slate-400 mt-4">点击更换头像</p>
    </div>

    <!-- 表单 -->
    <div class="bg-white rounded-2xl mx-4 mt-6 shadow-sm divide-y divide-slate-100">
      <div class="flex items-center px-4 py-4">
        <span class="w-20 text-[15px] text-slate-500">昵称</span>
        <input type="text" value="用户27674544" class="flex-1 text-right text-[15px] text-slate-800 outline-none">
        <i class="fa-solid fa-pen text-[12px] text-slate-300 ml-2"></i>
      </div>
      <div class="flex items-center px-4 py-4">
        <span class="w-20 text-[15px] text-slate-500">UID</span>
        <span class="flex-1 text-right text-[15px] text-slate-400">27674544</span>
      </div>
      <div class="flex items-center px-4 py-4">
        <span class="w-20 text-[15px] text-slate-500">性别</span>
        <span class="flex-1 text-right text-[15px] text-slate-800">男</span>
        <i class="fa-solid fa-chevron-right text-[12px] text-slate-300 ml-2"></i>
      </div>
      <div class="flex items-center px-4 py-4">
        <span class="w-20 text-[15px] text-slate-500">生日</span>
        <span class="flex-1 text-right text-[15px] text-slate-800">2000-01-01</span>
        <i class="fa-solid fa-chevron-right text-[12px] text-slate-300 ml-2"></i>
      </div>
    </div>

    <!-- 个性签名 -->
    <div class="bg-white rounded-2xl mx-4 mt-4 p-4 shadow-sm">
      <p class="text-[15px] text-slate-500 mb-2">个性签名</p>
      <textarea rows="3" class="w-full bg-slate-50 rounded-xl px-4 py-3 text-[14px] text-slate-700 outline-none resize-none focus:ring-2 focus:ring-[#5B5FE9]/40" placeholder="写点什么介绍自己吧~">今天也是想做表情包的一天</textarea>
      <p class="text-right text-[11px] text-slate-300 mt-1">12/50</p>
    </div>

    <!-- 保存按钮 -->
    <div class="px-4 mt-6">
      <button class="w-full py-4 rounded-2xl bg-[#5B5FE9] text-white font-bold text-[16px] shadow-lg shadow-[#5B5FE9]/30"><i class="fa-solid fa-check mr-2"></i>保存修改</button>
    </div>
  </div>
</div>

</body>
</html>
