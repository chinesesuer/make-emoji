<script>
  // ===== 五步子Tab：点击 + 左右滑动切换 =====
  const panels = [...document.querySelectorAll('.panel')];
  const stabs  = [...document.querySelectorAll('.stab')];
  let cur = 0;
  function go(i){
    cur = Math.max(0, Math.min(4, i));
    panels.forEach(p => p.classList.toggle('hidden', +p.dataset.i !== cur));
    stabs.forEach(t => {
      const on = +t.dataset.i === cur;
      t.classList.toggle('font-bold', on);
      t.classList.toggle('text-white', on);
      t.classList.toggle('text-white/60', !on);
      t.querySelector('span')?.remove();
      if(on){ const bar=document.createElement('span'); bar.className='absolute bottom-0 left-1/2 -translate-x-1/2 w-7 h-[3px] bg-white rounded-full'; t.appendChild(bar); }
    });
  }
  stabs.forEach(t => t.addEventListener('click', () => go(+t.dataset.i)));

  const wrap = document.getElementById('panelWrap');
  let sx=0, sy=0, tracking=false;
  wrap.addEventListener('touchstart', e => { sx=e.touches[0].clientX; sy=e.touches[0].clientY; tracking=true; }, {passive:true});
  wrap.addEventListener('touchend', e => {
    if(!tracking) return; tracking=false;
    const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.5) go(cur + (dx<0?1:-1));
  });
  wrap.addEventListener('mousedown', e => { sx=e.clientX; sy=e.clientY; tracking=true; });
  wrap.addEventListener('mouseup', e => {
    if(!tracking) return; tracking=false;
    const dx=e.clientX-sx, dy=e.clientY-sy;
    if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.5) go(cur + (dx<0?1:-1));
  });

  // ===== 分类chip / 素材tile 选中态 =====
  document.querySelectorAll('#catRow').forEach(row=>{
    row.addEventListener('click', e=>{
      const btn=e.target.closest('.cat'); if(!btn) return;
      row.querySelectorAll('.cat').forEach(c=>{
        c.className='cat shrink-0 px-4 py-1.5 rounded-full text-[14px] bg-slate-100 text-slate-500 border border-transparent';
      });
      btn.className='cat shrink-0 px-4 py-1.5 rounded-full text-[14px] bg-[#5B5FE9]/10 text-[#5B5FE9] font-semibold border border-[#5B5FE9]/30';
    });
  });
  document.querySelectorAll('.panel').forEach(p=>{
    p.addEventListener('click', e=>{
      const tile=e.target.closest('.tile'); if(!tile || tile.querySelector('i.fa-plus')) return;
      p.querySelectorAll('.tile').forEach(t=>t.classList.remove('ring-2','ring-[#5B5FE9]','border-[#5B5FE9]'));
      tile.classList.add('ring-2','ring-[#5B5FE9]');
    });
  });
</script>
</body>
</html>
